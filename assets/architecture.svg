  <rect x="460" y="120" width="440" height="122" rx="18" fill="#163249" stroke="#32c7be" stroke-width="2"/>
  <text x="680" y="163" class="title" text-anchor="middle">Streamlit frontend</text>
  <text x="680" y="197" class="desc" text-anchor="middle">Career Guides · Search · AI Mentor</text>
  <text x="680" y="222" class="small" text-anchor="middle">Input, results and session chat history</text>
  <path class="edge" d="M680 242V292"/>
  <text x="705" y="274" class="small">HTTP / JSON</text>
  <rect x="460" y="294" width="440" height="112" rx="18" fill="#193051" stroke="#7faeff" stroke-width="2"/>
  <text x="680" y="338" class="title" text-anchor="middle">FastAPI + Pydantic</text>
  <text x="680" y="374" class="desc" text-anchor="middle">REST endpoints · validation · routing</text>
 </g>
