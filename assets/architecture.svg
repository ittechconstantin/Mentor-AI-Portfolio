<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 775" role="img" aria-label="IT Career Mentor architecture diagram with Streamlit, FastAPI, MySQL, ChromaDB, LangChain, and OpenAI models">
 <defs>
  <style>
    .h{font-family:Arial,sans-serif;fill:#f4f8ff;font-size:27px;font-weight:700}.sub{font-family:Arial,sans-serif;fill:#a9bbd3;font-size:17px}.title{font-family:Arial,sans-serif;fill:#f4f8ff;font-size:25px;font-weight:700}.desc{font-family:Arial,sans-serif;fill:#bdd0e4;font-size:17px}.small{font-family:Arial,sans-serif;fill:#9eb7d3;font-size:16px}.edge{fill:none;stroke:#6cc2e1;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6cc2e1"/></marker>
 </defs>
